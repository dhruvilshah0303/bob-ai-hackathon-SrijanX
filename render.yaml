services:
  - type: web
    name: ai-ambulance-coordinator-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: cd src/backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: DEMO_TIME_SCALE
        value: "10"
      - key: APP_ACCESS_TOKEN
        value: ""
      - key: DATABASE_URL
        value: ""