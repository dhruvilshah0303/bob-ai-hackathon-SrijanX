databases:
  - name: srijanx-db
    plan: free
    databaseName: srijanx
    user: srijanx

services:
  - type: web
    name: ai-ambulance-coordinator-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r src/backend/requirements.txt && cd src/backend && alembic upgrade head
    startCommand: cd src/backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://frontend-ruby-iota-56.vercel.app"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: srijanx-db
          property: connectionString
