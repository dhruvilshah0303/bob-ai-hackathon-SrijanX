submission:
  title: "AI Ambulance-to-Hospital Coordinator"
  problem_statement: >
    Emergency dispatchers cannot choose the best destination from distance alone.
    They need a current view of hospital capacity, specialist availability, and
    traffic so an ambulance reaches appropriate treatment as quickly as possible.
  solution_summary: >
    This project provides an explainable FastAPI coordinator that filters hospitals
    by clinical constraints and ranks viable options by total time to treatment.
    A browser dashboard shows live ambulance movement, reservations, rerouting,
    hospital pre-alerts, and operational analytics.
  key_features:
    - "Explainable hospital recommendation using capacity, capability, and ETA"
    - "Real-time Leaflet map with concurrent ambulance trips"
    - "Capacity reservation, release, and dynamic rerouting"
    - "Hospital pre-alerts and persistent audit analytics"
    - "Traffic-aware ETA with a deterministic simulated fallback"
  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "Uvicorn", "Leaflet"]
    ibm_technologies: []
    databases: ["SQLite", "PostgreSQL"]
    other: ["Docker", "GitHub Actions", "WebSockets", "OpenStreetMap"]
  what_we_are_most_proud_of: >
    The recommendation is a constrained, explainable decision rather than a
    nearest-hospital lookup. The demo makes the tradeoff visible and models
    multiple ambulances competing for shared hospital capacity.
  known_limitations: >
    Hospital data and ambulance movement are simulated for the prototype. The
    system uses a shared access token instead of user roles, and production use
    would require integrations with hospital information systems and a durable
    shared state store for in-flight trips.

